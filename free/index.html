<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../shared/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Freies Journaling</title>

      <!-- Google Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <!-- Google Material Design -->
    <script type="module" src="https://esm.run/@material/web/all.js"></script>

</head>

<body>
    
<main class="page-container">

    <header class="page-header">
        <span class="material-symbols-outlined page-logo">
            edit_note
        </span>
        <h1>Freies Journaling</h1>

    </header>

<section class="intro-section">
        <h2 class="welcome-heading">Herzlich Willkommen</h2>
        <p>Nehmen Sie sich einen Moment Zeit, um Ihre Gedanken, Gefühle und Erlebnisse schriftlich festzuhalten.</p>
</section>

<section class="action-section">

        <md-filled-button id="newEntryButton">
            <span slot="icon" class="material-symbols-outlined">
                add
            </span>
            Neuer Eintrag
        </md-filled-button>

        <md-outlined-button id="MyEntriesButton">
            <span slot="icon" class="material-symbols-outlined">
                history
            </span>
            Meine Einträge
        </md-outlined-button>

</section>

</main>

    <script src="js/script.js" defer></script>
</body>
</html>
