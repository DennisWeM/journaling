<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neuer Eintrag</title>

    <!-- Google Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <!-- Material Web -->
    <script type="module" src="https://esm.run/@material/web/all.js"></script>

    <link rel="stylesheet" href="../shared/css/style.css">

</head>

<body>

    <main class="page-container">

        <header class="page-header">

            <span class="material-symbols-outlined page-logo">
                edit_note
            </span>

            <h1>Neuer Eintrag</h1>

        </header>

        <section class="intro-section">

            <h2>Freies Journaling</h2>

            <p>
                Nehmen Sie sich einen Moment Zeit und schreiben Sie alles auf, was Sie heute beschäftigt.
            </p>

        </section>

        <section class="journal-section">

     <section class="journal-section">

    <label for="journalText" class="journal-label">
        Ihr Journaleintrag
    </label>

    <textarea
        id="journalText"
        name="journalText"
        placeholder="Beginnen Sie hier mit Ihrem Eintrag..."
    ></textarea>

</section>

        <section class="action-section">

            <md-filled-button id="saveButton">

                <span slot="icon" class="material-symbols-outlined">
                    save
                </span>

                Speichern

            </md-filled-button>

            <a href="index.html">
            <md-outlined-button id="backButton">

                <span slot="icon" class="material-symbols-outlined">
                    arrow_back
                </span>

                Zurück

            </md-outlined-button>
            </a>
        </section>

    </main>

</body>

</html>
