<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geführtes Journaling</title>

    <!-- Google Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <!-- Material Web -->
    <script type="module" src="https://esm.run/@material/web/all.js"></script>

    <!-- Gemeinsames CSS -->
    <link rel="stylesheet" href="../shared/css/style.css">
</head>

<body>

    <main class="page-container">

        <header class="page-header">

            <span class="material-symbols-outlined page-logo" aria-hidden="true">
                edit_note
            </span>

            <h1>Geführtes Journaling</h1>

        </header>

        <section class="intro-section">

            <h2>Herzlich willkommen</h2>

            <p>
                Nimm dir einen Moment Zeit, um deine Gedanken
                anhand ausgewählter Reflexionsfragen festzuhalten.
            </p>

        </section>

        <section class="action-section">

            <a href="new_entry.html">
                <md-filled-button id="newEntryButton">

                    <span slot="icon" class="material-symbols-outlined">
                        add
                    </span>

                    Neuer Eintrag

                </md-filled-button>
            </a>

            <a href="entries.html">
                <md-outlined-button id="myEntriesButton">

                    <span slot="icon" class="material-symbols-outlined">
                        history
                    </span>

                    Meine Einträge

                </md-outlined-button>
            </a>

        </section>

    </main>

</body>

</html>
